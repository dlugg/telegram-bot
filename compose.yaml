services:
    db:
        image: postgres:17
        environment:
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: javabot
            JAVA_TOOL_OPTIONS: -Xmx256m
        volumes:
            - botdata:/var/lib/postgresql/data
            - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
        ports:
            - "127.0.0.1:5434:5432"
        restart: unless-stopped

    bot:
        build: .
        env_file: .env
        environment:
            DATABASE_URL: jdbc:postgresql://db:5432/javabot
        depends_on:
            - db
        restart: unless-stopped


volumes:
    botdata:
